name: Tandem
options:
  bundleIdPrefix: com.rofel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  TandemCore:
    path: ../Core
targets:
  Tandem:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: TandemCore
        product: TandemCore
      - package: TandemCore
        product: TandemUI
      - sdk: ScreenCaptureKit.framework
      - sdk: AVFoundation.framework
      - sdk: ServiceManagement.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tandem
        CFBundleShortVersionString: $(TANDEM_VERSION)
        CFBundleVersion: $(TANDEM_BUILD)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Tandem"
        NSPrincipalClass: NSApplication
        TandemUpdateRepository: RephaelCongmon/tandem
        # Tandem listens for the other Mac with no window open; macOS must not quit it.
        NSSupportsAutomaticTermination: false
        NSLocalNetworkUsageDescription: "Tandem finds your other Mac on the local network, over peer-to-peer Wi-Fi, or through a cable so the two can share the screen securely."
        NSBonjourServices:
          - _tandem._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBluetoothAlwaysUsageDescription: "Tandem uses Bluetooth to reach your other Mac when there's no shared network."
        NSCameraUsageDescription: "Tandem can share this Mac's camera with your other Mac when you choose the camera as the source."
        NSScreenCaptureUsageDescription: "Tandem shares this Mac's screen, and its sound when the other Mac listens, with the other Mac you paired, only while sharing is on."
        NSSpeechRecognitionUsageDescription: "Tandem turns the shared Mac's audio into a live transcript on this Mac, so questions asked out loud in a meeting can be answered."
    entitlements:
      path: Tandem.entitlements
      # Not sandboxed (the user's explicit choice): the Claude Code provider runs the user's
      # own `claude` CLI, which needs its sign-in and install. The hardened runtime still
      # gates the camera.
      properties:
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rofel.tandem
        PRODUCT_NAME: Tandem
        DEVELOPMENT_TEAM: 2TJNTBA58V
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "13"
        TANDEM_VERSION: $(MARKETING_VERSION)
        TANDEM_BUILD: $(CURRENT_PROJECT_VERSION)
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        # Development builds are numbered 0.0.0 so macOS never opens one instead of the
        # installed release (it prefers the highest version of an app).
        Debug:
          TANDEM_VERSION: "0.0.0"
          TANDEM_BUILD: "0"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  TandemAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Tandem
      - package: TandemCore
        product: TandemCore
      - package: TandemCore
        product: TandemUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rofel.tandem.tests
        DEVELOPMENT_TEAM: 2TJNTBA58V
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tandem.app/Contents/MacOS/Tandem
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Tandem:
    build:
      targets:
        Tandem: all
    test:
      targets:
        - TandemAppTests
    run:
      config: Debug
    archive:
      config: Release
